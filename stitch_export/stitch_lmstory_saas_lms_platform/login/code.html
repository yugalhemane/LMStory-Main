<!-- Login Container -->
<main class="w-full max-w-[420px] z-10">
<!-- Brand Identity Header -->
<div class="flex flex-col items-center mb-lg">
<div class="flex items-center gap-sm mb-xs">
<span class="material-symbols-outlined text-secondary text-[40px]" data-icon="school" style="font-variation-settings: 'FILL' 1;">school</span>

</div>
<p class="text-on-surface-variant font-body-md text-body-md">Enterprise Learning Management System</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-xl login-card">
<div class="mb-lg">
<h2 class="text-on-surface font-headline-lg text-headline-lg mb-xs">Welcome back</h2>
<p class="text-on-surface-variant font-body-sm text-body-sm">Please enter your credentials to access your portal.</p>
</div>
<form class="space-y-md" id="login-form" onsubmit="event.preventDefault();">
<!-- Tenant Selection (White-label feature) -->
<div class="space-y-xs">
<label class="text-on-surface font-label-md text-label-md" for="tenant">Organization</label>
<div class="relative">
<select class="w-full h-11 pl-md pr-xl appearance-none bg-surface border border-outline-variant rounded-lg font-body-md text-body-md focus:ring-2 focus:ring-secondary/20 focus:border-secondary outline-none transition-all" id="tenant">
<option value="acme">Acme Corporation</option>
<option value="global">Global Industries</option>
<option value="tech">TechNova Solutions</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Email Field -->
<div class="space-y-xs">
<label class="text-on-surface font-label-md text-label-md" for="email">Email address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]" data-icon="mail">mail</span>
<input class="w-full h-11 pl-11 pr-md bg-surface border border-outline-variant rounded-lg font-body-md text-body-md focus:ring-2 focus:ring-secondary/20 focus:border-secondary outline-none transition-all placeholder:text-outline" id="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="text-on-surface font-label-md text-label-md" for="password">Password</label>
<a class="text-secondary font-label-md text-label-md hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]" data-icon="lock">lock</span>
<input class="w-full h-11 pl-11 pr-11 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md focus:ring-2 focus:ring-secondary/20 focus:border-secondary outline-none transition-all placeholder:text-outline" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Policy -->
<div class="flex items-center gap-sm">

<label class="text-on-surface-variant font-body-sm text-body-sm cursor-pointer select-none" for="remember">Remember me on this device</label>
</div>
<!-- Action Button -->
<button class="w-full h-12 bg-secondary text-on-secondary font-title-md text-title-md rounded-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-sm shadow-sm" type="submit">

                Don't have an account? <a class="text-secondary font-title-md hover:underline" href="#">Contact your administrator</a>
</p>

<a class="hover:text-on-surface-variant transition-colors" href="#">Privacy Policy</a>
<span class="w-1 h-1 rounded-full bg-outline-variant mt-1.5"></span>
<a class="hover:text-on-surface-variant transition-colors" href="#">Terms of Service</a>
<span class="w-1 h-1 rounded-full bg-outline-variant mt-1.5"></span>
<a class="hover:text-on-surface-variant transition-colors" href="#">Support</a>
</div>

<!-- Interactive Layer -->
<script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('password-toggle-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Simple enter key handling for accessibility
        document.getElementById('login-form').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                const btn = this.querySelector('button[type="submit"]');
                btn.click();
            }
        });

        // Atmospheric mouse effect (optional micro-interaction)
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            const card = document.querySelector('.login-card');
            const moveX = (x - 0.5) * 10;
            const moveY = (y - 0.5) * 10;
            
            // card.style.transform = `translate(${moveX}px, ${moveY}px)`; // Disabled for strict enterprise feel, but code is here
        });
    </script>
