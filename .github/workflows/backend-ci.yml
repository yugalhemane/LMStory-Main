name: Backend CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Monorepo Dependencies
      run: npm ci

    - name: Prisma Generate
      run: npm run --workspace=apps/backend prisma:generate || npx prisma generate --schema=apps/backend/prisma/schema.prisma

    - name: TypeScript Typecheck
      run: npm run --workspace=apps/backend typecheck || npx tsc --noEmit -p apps/backend/tsconfig.json

    - name: Production Build
      run: npm run --workspace=apps/backend build

